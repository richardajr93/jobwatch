<!doctype html><html><head><meta charset="utf-8"><title>Job Watch</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font-family:Arial,sans-serif;margin:20px;color:#222}h1{margin:0 0 4px}.sub{color:#666;margin-bottom:14px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}input,select{padding:7px;font-size:14px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid #ddd;padding:7px;vertical-align:top;text-align:left}
th{background:#1f3864;color:#fff;position:sticky;top:0}.GO{background:#e6f4ea}.REVIEW{background:#fff8e1}.SKIP{background:#f5f5f5;color:#777}
.tag{font-weight:bold}.new{background:#d32f2f;color:#fff;border-radius:3px;padding:1px 5px;font-size:11px;margin-right:4px}
.why{font-size:12px;color:#444}.bad{color:#b71c1c;font-weight:bold}.ok{color:#2e7d32}a{color:#1a56c9}</style></head><body>
<h1>Job Watch</h1><div class="sub">DEMO DATA, updated Nov 03, 2026 04:37 AM</div>
<div class="bar"><input id="q" placeholder="Search company or title" oninput="draw()">
<select id="v" onchange="draw()"><option value="">All verdicts</option><option>GO</option><option>REVIEW</option><option>SKIP</option></select>
<label><input type="checkbox" id="n" onchange="draw()"> New only</label>
<label><input type="checkbox" id="h" onchange="draw()"> Healthcare only</label>
<label><input type="checkbox" id="s" onchange="draw()" checked> Hide SKIP</label><span id="c"></span></div>
<table><thead><tr><th>Verdict</th><th>Company</th><th>Title</th><th>Location</th><th>Pay</th><th>Why</th><th>Posted</th></tr></thead><tbody id="b"></tbody></table>
<h3>Source health</h3><table style="width:auto"><tr><th>Source</th><th>Status</th><th>Detail</th></tr><tr><td>Demo data</td><td class='ok'>ok</td><td>8 sample postings</td></tr></table>
<script>const D=[{"verdict": "GO", "lane": "FP&A / Finance", "skips": [], "flags": [], "notes": ["Named platforms (note only, never a skip): adaptive, workday"], "healthcare": true, "pay": "$120,000-$140,000", "id": "d1", "company": "Private Health Management", "title": "FP&A Manager", "location": "Remote, United States", "url": "https://example.com/phm", "posted": "", "new": true}, {"verdict": "REVIEW", "lane": "FP&A / Finance", "skips": [], "flags": ["People-management language: read the posting", "Medicare Advantage knowledge expected"], "notes": ["Named platforms (note only, never a skip): hyperion"], "healthcare": true, "pay": "$104,000-$143,000", "id": "d5", "company": "Humana", "title": "Market Finance Lead", "location": "United States (Remote)", "url": "https://example.com/humana", "posted": "", "new": true}, {"verdict": "REVIEW", "lane": "Strategy / Consulting", "skips": [], "flags": ["Optum-family company: exposure check"], "notes": [], "healthcare": true, "pay": "$120,000-$130,000", "id": "d7", "company": "SCA Health", "title": "Corporate Development Associate | Mergers & Acquisitions", "location": "United States (Remote)", "url": "https://example.com/sca", "posted": "", "new": true}, {"verdict": "REVIEW", "lane": "Strategy / Consulting", "skips": [], "flags": ["Pay not posted", "Experience gap: asks 8+ years vs 4.3"], "notes": ["Named platforms (note only, never a skip): capital iq, pitchbook"], "healthcare": false, "pay": "", "id": "d6", "company": "Crowley", "title": "Sr. Analyst, Strategy", "location": "Jacksonville, FL (Remote)", "url": "https://example.com/crowley", "posted": "", "new": true}, {"verdict": "SKIP", "lane": "Strategy / Consulting", "skips": ["GTM / sales finance: 'pipeline, territory'"], "flags": ["Residency or commute requirement: check it covers Florida"], "notes": [], "healthcare": true, "pay": "$135,700-$159,940", "id": "d3", "company": "Cardinal Health", "title": "Consultant, Territory Management - Pharmacy Business Consultant", "location": "Pennsylvania (Remote)", "url": "https://example.com/cardinal", "posted": "", "new": true}, {"verdict": "SKIP", "lane": "Strategy / Consulting", "skips": ["On-site or hybrid outside accepted metros"], "flags": ["Residency or commute requirement: check it covers Florida"], "notes": [], "healthcare": true, "pay": "$130,000-$200,000", "id": "d8", "company": "EY-Parthenon", "title": "Corporate and Growth Strategy - Health - Sr Assoc/Consultant", "location": "Atlanta, GA (Hybrid)", "url": "https://example.com/ey", "posted": "", "new": true}, {"verdict": "SKIP", "lane": "FP&A / Finance", "skips": ["GTM / sales finance: 'pipeline, bookings, cac'"], "flags": [], "notes": [], "healthcare": false, "pay": "$150,000-$175,000", "id": "d2", "company": "Garner Health", "title": "FP&A Manager, GTM", "location": "New York, NY (Remote)", "url": "https://example.com/garner", "posted": "", "new": true}, {"verdict": "SKIP", "lane": "FP&A / Finance", "skips": ["Title is outside target functions", "Insurance-specific finance: 'medical economics'"], "flags": ["SQL mentioned: check if required or preferred", "Possible down-level title"], "notes": [], "healthcare": false, "pay": "$111,034", "id": "d4", "company": "Oscar Health", "title": "Associate, Medical Economics", "location": "Remote", "url": "https://example.com/oscar", "posted": "", "new": true}];function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function draw(){const q=document.getElementById('q').value.toLowerCase(),v=document.getElementById('v').value,n=document.getElementById('n').checked,h=document.getElementById('h').checked,s=document.getElementById('s').checked;
const rows=D.filter(r=>(!q||(r.company+' '+r.title).toLowerCase().includes(q))&&(!v||r.verdict==v)&&(!n||r.new)&&(!h||r.healthcare)&&(!s||r.verdict!='SKIP'));
document.getElementById('c').textContent=rows.length+' shown of '+D.length;
document.getElementById('b').innerHTML=rows.map(r=>`<tr class="${r.verdict}"><td><span class="tag">${r.verdict}</span></td><td>${esc(r.company)}</td><td>${r.new?'<span class="new">NEW</span>':''}<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a></td><td>${esc(r.location)}</td><td>${esc(r.pay)}</td><td class="why">${esc(r.skips.concat(r.flags).concat(r.notes).join(' | '))}</td><td>${esc(r.posted)}</td></tr>`).join('')}draw();</script></body></html>
